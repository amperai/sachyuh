<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrovaní | sachyuh.cz</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="../assets/favicon-sachyuh.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .admin-wrap { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 2rem; color: #001e32; margin-bottom: 0.25rem; }
    .meta { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
    .toolbar input {
      padding: 7px 12px; border: 1.5px solid #ccd0d5; border-radius: 7px;
      font-size: 0.9rem; font-family: inherit;
    }
    .btn { padding: 8px 20px; background: #001e32; color: #fff; border: none; border-radius: 7px;
           font-family: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #003a5c; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    thead th { background: #001e32; color: #fff; padding: 10px 12px; text-align: left; }
    tbody tr:nth-child(even) { background: #f4f6f8; }
    tbody td { padding: 9px 12px; border-bottom: 1px solid #e0e3e7; vertical-align: top; }
    td.note { white-space: pre-wrap; }
    .empty { color: #888; text-align: center; padding: 2rem; }
    .err { color: #c0392b; font-weight: 600; }
    #loginForm { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    #data { display: none; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html" aria-label="sachyuh.cz">
      <img class="brand-logo brand-logo-wide" src="../assets/brand-sachyuh.png" alt="sachyuh.cz">
    </a>
  </header>

  <div class="admin-wrap">
    <h1>Registrovaní</h1>

    <form id="loginForm" class="toolbar">
      <input type="password" id="heslo" placeholder="Heslo" autocomplete="current-password" required>
      <button class="btn" type="submit">Zobrazit</button>
      <span id="loginMsg" class="err" aria-live="polite"></span>
    </form>

    <div id="data">
      <p class="meta"><span id="status"></span></p>
      <div class="toolbar">
        <input type="search" id="filterText" placeholder="Hledat…">
        <button class="btn" id="exportBtn">Exportovat CSV</button>
        <button class="btn" id="reloadBtn" style="background:#555">Obnovit</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Jméno</th>
              <th>Telefon</th>
              <th>E-mail</th>
              <th>Poznámka</th>
              <th>Odesláno</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let heslo = '';
    let allRows = [];

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function formatDate(ts) {
      return new Date(ts).toLocaleString('cs-CZ', { dateStyle: 'short', timeStyle: 'short' });
    }

    function filtered() {
      const q = document.getElementById('filterText').value.trim().toLowerCase();
      if (!q) return allRows;
      return allRows.filter(r =>
        [r.name, r.phone, r.email, r.note].join(' ').toLowerCase().includes(q));
    }

    function render() {
      const rows = filtered();
      const tbody = document.getElementById('tableBody');
      if (rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty">Žádné záznamy.</td></tr>';
        return;
      }
      tbody.innerHTML = rows.map((r, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${esc(r.name)}</td>
          <td><a href="tel:${esc(r.phone.replace(/\s/g, ''))}">${esc(r.phone)}</a></td>
          <td>${r.email ? `<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>` : '—'}</td>
          <td class="note">${esc(r.note || '')}</td>
          <td>${formatDate(r.created_at)}</td>
        </tr>
      `).join('');
    }

    async function load() {
      const res = await fetch('/api/sachyuh/registrovani', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ heslo }),
      });
      if (!res.ok) throw new Error(res.status === 401 ? 'Špatné heslo.' : (await res.text()) || 'Chyba serveru.');
      allRows = await res.json();
      document.getElementById('status').textContent = `Celkem: ${allRows.length}`;
      render();
    }

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const msg = document.getElementById('loginMsg');
      heslo = document.getElementById('heslo').value;
      msg.textContent = 'Ověřuji…';
      try {
        await load();
        msg.textContent = '';
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('data').style.display = 'block';
      } catch (err) {
        msg.textContent = err.message;
      }
    });

    document.getElementById('filterText').addEventListener('input', render);
    document.getElementById('reloadBtn').addEventListener('click', () =>
      load().catch(err => { document.getElementById('status').textContent = err.message; }));

    document.getElementById('exportBtn').addEventListener('click', () => {
      const csv = ['#,Jméno,Telefon,E-mail,Poznámka,Odesláno', ...filtered().map((r, i) =>
        [i + 1, r.name, r.phone, r.email || '', r.note || '', new Date(r.created_at).toLocaleString('cs-CZ')]
          .map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')
      )].join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
      a.download = 'registrovani.csv';
      a.click();
    });
  </script>
</body>
</html>
