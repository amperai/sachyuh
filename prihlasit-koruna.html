<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Přihlášení · Na Koruně 21. 6. | ŠO Mařatice</title>
  <meta name="description" content="Nezávazné přihlášení na první turnaj Letní šachové tour 2026 — Na Koruně 21. června.">
  <meta name="theme-color" content="#001e32">
  <link rel="icon" type="image/png" href="assets/favicon-sachyuh.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="sachyuh.cz">
      <img class="brand-logo brand-logo-wide" src="assets/brand-sachyuh.png" alt="sachyuh.cz">
    </a>
    <nav class="top-nav" aria-label="Hlavní navigace">
      <a href="tour.html">Zpět na Tour</a>
    </nav>
  </header>

  <main>
    <section class="content signup-section" aria-labelledby="signup-title">
      <div class="signup-inner">
        <p class="eyebrow">První turnaj · 21. 6. · Na Koruně</p>
        <h1 id="signup-title">Nezávazné přihlášení</h1>
        <p class="signup-desc">Přihlaste se e-mailem a budeme vědět, že přijdete. Pomůže nám to lépe odhadnout, kolik nás přibližně bude. Prezentace proběhne jako vždy na místě.</p>
        <form id="signupForm" class="signup-form" novalidate>
          <div class="signup-row">
            <div class="signup-field">
              <label for="signupName">Jméno <span class="optional">(nepovinné)</span></label>
              <input type="text" id="signupName" name="name" placeholder="Vaše jméno" autocomplete="name" maxlength="100">
            </div>
            <div class="signup-field">
              <label for="signupEmail">E-mail <span class="required">*</span></label>
              <input type="email" id="signupEmail" name="email" placeholder="vas@email.cz" autocomplete="email" required maxlength="200">
            </div>
          </div>
          <button type="submit" class="btn-signup">Přihlásit se</button>
          <p id="signupMsg" class="signup-msg" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>sachyuh.cz</span>
    <a href="tour.html">Zpět na Tour</a>
  </footer>

  <style>
    .signup-inner {
      max-width: 680px;
      padding: clamp(22px, 4vw, 34px);
      background: rgba(255, 255, 255, .78);
      border: 1px solid var(--line);
      box-shadow: 0 12px 34px rgba(0, 30, 50, .08);
    }
    .signup-desc { color: var(--muted); margin-bottom: 20px; line-height: 1.6; }
    .signup-form { display: flex; flex-direction: column; gap: 16px; }
    .signup-row { display: flex; gap: 16px; flex-wrap: wrap; }
    .signup-field { display: flex; flex-direction: column; gap: 6px; flex: 1 1 200px; }
    .signup-field label { font-size: 0.875rem; font-weight: 600; color: var(--ink); }
    .optional { font-weight: 400; color: var(--muted); }
    .required { color: #c0392b; }
    .signup-field input {
      padding: 10px 14px; border: 1.5px solid rgba(16, 32, 51, .2); border-radius: 8px;
      font-size: 1rem; font-family: inherit; background: #fff; width: 100%; box-sizing: border-box;
      transition: border-color 0.15s;
    }
    .signup-field input:focus { outline: none; border-color: var(--ink); }
    .btn-signup {
      align-self: flex-start; padding: 11px 30px; background: var(--ink); color: #fff;
      border: none; border-radius: 8px; font-size: 1rem; font-family: inherit;
      font-weight: 700; cursor: pointer; transition: background 0.15s, opacity 0.15s;
    }
    .btn-signup:hover { background: #003a5c; }
    .btn-signup:disabled { opacity: .5; cursor: default; }
    .signup-msg { font-size: 0.9rem; min-height: 1.2em; }
    .signup-msg.ok { color: #1a7a4a; font-weight: 600; }
    .signup-msg.err { color: #c0392b; font-weight: 600; }
    @media (max-width: 500px) {
      .signup-row { flex-direction: column; }
    }
  </style>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = this.querySelector('button[type=submit]');
      const msg = document.getElementById('signupMsg');
      const email = document.getElementById('signupEmail').value.trim();
      const name = document.getElementById('signupName').value.trim();

      if (!email || !email.includes('@')) {
        msg.textContent = 'Zadejte platný e-mail.';
        msg.className = 'signup-msg err';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Odesílám…';
      msg.textContent = '';
      msg.className = 'signup-msg';

      try {
        const res = await fetch('/api/tour-registrations', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, name: name || undefined, tournament: 'koruna-21-6-2026' }),
        });
        let data;
        try {
          data = await res.json();
        } catch {
          throw new Error('bad_response:' + res.status);
        }
        msg.textContent = data.message || (data.ok ? 'Přihlášení proběhlo úspěšně!' : 'Chyba.');
        msg.className = data.ok ? 'signup-msg ok' : 'signup-msg err';
        if (data.ok) {
          this.reset();
          btn.textContent = '✓ Přihlášeno';
        } else {
          btn.disabled = false;
          btn.textContent = 'Přihlásit se';
        }
      } catch (err) {
        if (err?.message?.startsWith('bad_response:')) {
          msg.textContent = 'Chyba serveru. Zkuste to prosím znovu.';
        } else {
          msg.textContent = 'Nepodařilo se připojit k serveru. Zkuste to prosím znovu.';
        }
        msg.className = 'signup-msg err';
        btn.disabled = false;
        btn.textContent = 'Přihlásit se';
      }
    });
  </script>
</body>
</html>
